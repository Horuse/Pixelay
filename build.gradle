plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'com.diffplug.spotless' version '8.10.3'
}

group = 'dev.horuse'
// Release builds pass -PreleaseVersion=<tag> (GitHub Actions, JitPack)
version = findProperty('releaseVersion') ?: '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.12.2'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'org.spongepowered:configurate-yaml:4.2.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier = ''
    relocate 'org.spongepowered.configurate', 'dev.horuse.pixelay.libs.configurate'
    relocate 'io.leangen.geantyref', 'dev.horuse.pixelay.libs.geantyref'
    relocate 'org.yaml.snakeyaml', 'dev.horuse.pixelay.libs.snakeyaml'
}

jar {
    archiveClassifier = 'plain'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

spotless {
    java {
        // FontWidths is generated by tools/fontgen and kept as-is
        targetExclude 'src/main/java/dev/horuse/pixelay/content/FontWidths.java'
        removeUnusedImports()
        prettier(['prettier': '3.9.9', 'prettier-plugin-java': '2.11.0'])
                .config(['parser': 'java', 'plugins': ['prettier-plugin-java'], 'tabWidth': 4, 'printWidth': 120])
    }
    yaml {
        target '*.yml', 'src/**/*.yml', '.github/**/*.yml'
        prettier('3.9.9').config(['tabWidth': 2])
    }
}

// The API artifact is the plain jar: consumers compile against it and rely on the
// Pixelay plugin installed on the server at runtime.
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'pixelay'
            artifact(tasks.named('jar')) {
                classifier = null
            }
            artifact(tasks.named('sourcesJar'))
            pom {
                name = 'Pixelay'
                description = 'Pixel-perfect text, buttons and cursors on flat in-world canvases for Paper servers.'
                url = 'https://github.com/Horuse/Pixelay'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
