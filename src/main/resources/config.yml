# Pixelay configuration. Apply changes with /pixelay reload.

# Layout of this file; do not change it by hand.
config-version: 2

# Log spawn/click diagnostics to the console.
debug: false

# Remove leftover Pixelay entities (e.g. after a crash) when the plugin enables.
cleanup-on-enable: true

scheduler:
  # How often registered CanvasSurfaces re-evaluate their dynamic text (ticks).
  refresh-period-ticks: 20
  # How often registered CanvasSurfaces are checked for dead entities and respawned (ticks).
  heal-period-ticks: 40

text:
  # Calibration: distance (font pixels) between the end of a TextDisplay's last line and the entity
  # position. 0 matches Minecraft 1.21.11; change only if texts sit off their boxes on another version.
  bottom-gap-font-px: 0
  # TextDisplay view range multiplier (higher = visible from farther away).
  view-range: 500
  # Render text at full brightness regardless of surrounding light.
  full-brightness: true
  # Maximum line width in font pixels before the client wraps text.
  line-width: 200
  shadow: false
  see-through: false
  # Background color as #AARRGGBB (#00000000 = transparent).
  background: "#00000000"

clicks:
  # Minimum delay between two routed clicks of the same player (milliseconds).
  debounce-ms: 150
  # Cancel Shift (dismount) input for players viewing a full-screen canvas.
  block-sneak-dismount: true
  # Clicks on a canvas are caught by invisible Interaction tiles laid over its plane; the clicked pixel
  # comes from the player's look ray, so buttons are hit exactly. Tile size in blocks: smaller tiles
  # stick out of a standing canvas less, but a canvas needs more of them.
  hit-tile-size: 0.25
  # Farthest a player may click a canvas from (blocks, eye to the clicked point). Clicks come as packets
  # handled before the server's own reach check, so this also stops modified clients clicking from afar.
  max-distance: 6

cursor:
  # Default CanvasCursor glyph (MiniMessage). Use a resource-pack glyph for a custom cursor.
  glyph: "+"
  # Default cursor height in canvas pixels.
  height-px: 17
  # Screens (ScreenSession) draw the cursor with the core shader of the generated pack: the client moves it
  # every frame, as smooth as the camera. Players need the pack (generated-pack below). false = a glyph
  # (glyph above) moved by the server every tick.
  shader: true

layers:
  # Distance (blocks) between two drawing layers in front of a canvas surface: box backgrounds, debug
  # panels, text backgrounds, text, cursor, in this order. The surface itself is the canvas' depthOffset
  # (where your background is). Raise it if layers flicker into each other from far away.
  step: 0.002

resource-packs:
  # Glyph widths of custom characters are measured from the packs in plugins/Pixelay/resourcepacks/
  # (folders or .zip files) on every start and /pixelay reload, into font-widths.generated.yml.
  # When several packs define the same character, the higher one wins, like in the client's pack list.
  # List pack file/folder names here, highest priority first; packs not listed follow alphabetically.
  order: []

generated-pack:
  # Pixelay builds its own resource pack into plugins/Pixelay/pixelay-pack.zip on every start and
  # /pixelay reload: the core shaders of the screen cursor and of texts cut at their box (CSS overflow),
  # for Minecraft 1.21.11. Give it to players (server resource pack, or merged into yours).
  # Files in plugins/Pixelay/pack/ go into the pack at the same path and replace Pixelay's own ones:
  # pack/cursors/<name>.png is a cursor sprite (at most 32x32 px), pack/assets/... any other asset.
  enabled: true
  cursor:
    # Size of the shader cursor: screen pixels per sprite pixel, on a 1080 pixel tall screen.
    scale: 1.5
    # The cursor sprites (pack/cursors/<name>.png, at most 7) and their hot spots in sprite pixels: the
    # point that points, like CSS cursor: url(...) x y. Boxes pick one with cursor("name"); without one
    # the cursor is "pointer" over clickable boxes and "default" elsewhere.
    sprites:
      default: [0.5, 0.5]
      pointer: [6, 0.5]
      text: [3.5, 8]
      not-allowed: [8.5, 8.5]

chat-suppression:
  # Allow ChatSuppression.suppress(player) to hide chat while a full-screen canvas is shown.
  enabled: true
  # Maximum queued messages per player; the oldest are dropped on overflow.
  queue-limit: 100
  # Queues longer than this are discarded instead of delivered on restore.
  deliver-limit: 20

packets:
  # First entity id used for packet-only (fake) entities. Must stay far above real entity ids.
  # Read once on first use; changing it requires a server restart.
  fake-entity-id-base: 1000000000
  # Display / TextDisplay entity metadata indexes. Defaults match Minecraft 1.21.11
  # (see https://minecraft.wiki/w/Java_Edition_protocol/Entity_metadata); adjust only when
  # running a Minecraft version whose metadata layout differs.
  metadata:
    transformation-start-delta: 8
    transformation-duration: 9
    position-interpolation-duration: 10
    translation: 11
    scale: 12
    left-rotation: 13
    right-rotation: 14
    billboard: 15
    brightness-override: 16
    view-range: 17
    text: 23
    line-width: 24
    background-color: 25
    text-opacity: 26
    style-flags: 27
    # Interaction (the invisible click boxes) width and height.
    interaction-width: 8
    interaction-height: 9
    # ItemDisplay item and display type, BlockDisplay block state (CanvasItem, CanvasBlock).
    item: 23
    item-display-transform: 24
    block-state: 23
